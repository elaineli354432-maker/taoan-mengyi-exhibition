name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Fix public asset paths
        run: |
          BASE="/${{ github.event.repository.name }}/"
          find dist/assets -type f \( -name "*.js" -o -name "*.css" \) -print0 | xargs -0 sed -i \
            -e "s#url('/images/#url('${BASE}images/#g" \
            -e "s#url(\"/images/#url(\"${BASE}images/#g" \
            -e "s#url(/images/#url(${BASE}images/#g" \
            -e "s#url('/zhang-dai-hero.png#url('${BASE}zhang-dai-hero.png#g" \
            -e "s#url(\"/zhang-dai-hero.png#url(\"${BASE}zhang-dai-hero.png#g" \
            -e "s#url(/zhang-dai-hero.png#url(${BASE}zhang-dai-hero.png#g" \
            -e "s#'/images/#'${BASE}images/#g" \
            -e "s#\"/images/#\"${BASE}images/#g" \
            -e "s#'/zhang-dai-hero.png#'${BASE}zhang-dai-hero.png#g" \
            -e "s#\"/zhang-dai-hero.png#\"${BASE}zhang-dai-hero.png#g"
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
